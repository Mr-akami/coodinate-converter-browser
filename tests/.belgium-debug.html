<!doctype html>
<html><body><pre id=log></pre><script type="module">
import { MissingGridError } from "/src/proj-api.js";
import { initProjRuntime } from '/src/proj-runtime.js';
const log = (m) => { document.getElementById('log').textContent += m + '\n'; console.log(m); };

(async () => {
  const { worker, api } = await initProjRuntime({
    apiBaseUrl: '/api/proj-data',
    wasmUrl: '/dist/proj_wasm.wasm',
    dataDirName: 'proj-data-be-debug',
  });
  log('init done');

  const cases = [
    ['EPSG:31370', 'EPSG:4326', 152000, 170000, 'BD72→WGS84'],
    ['EPSG:31370', 'EPSG:3812', 150327, 170563, 'BL72→BL2008 Brussels'],
    ['EPSG:31370', 'EPSG:3812', 153093, 211536, 'BL72→BL2008 Antwerp'],
  ];

  let nextId = 1000;
  function rpc(msg) {
    return new Promise((resolve, reject) => {
      const id = nextId++;
      const h = (e) => {
        if (e.data.id !== id) return;
        worker.removeEventListener('message', h);
        if (e.data.type === 'error') reject(new Error(e.data.error));
        else resolve(e.data);
      };
      worker.addEventListener('message', h);
      worker.postMessage({ ...msg, id });
    });
  }

  for (const [src, dst, x, y, label] of cases) {
    log(`\n=== ${label} (${src} → ${dst}) at (${x},${y}) ===`);
    try {
      const prep = await rpc({ type: 'prepare', src, dst, x, y });
      log('  grids needed: ' + JSON.stringify(prep.grids));
    } catch (e) {
      log('  prepare ERROR: ' + e.message);
      continue;
    }
    try {
      const r = await api.transform(src, dst, x, y, 0);
      log(`  transform OK: (${r.x.toFixed(7)}, ${r.y.toFixed(7)})`);
    } catch (e) {
      log(`  transform ERROR: ${e.name}/${e.reason || ''}: ${e.message}`);
    }
  }
  log('\nDONE');
})().catch((e) => log('FATAL: ' + (e.message || e)));
</script></body></html>
