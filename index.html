<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PROJ JGD2025 / sc-proj-data 検証</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        padding: 24px;
        background: #0b0f14;
        color: #cfd8e3;
        max-width: 600px;
        margin: 0 auto;
      }
      h1 { font-size: 1.2em; margin-bottom: 4px; }
      .subtitle { font-size: 0.8em; color: #8899aa; margin-bottom: 20px; }
      label { display: block; margin-top: 12px; font-size: 0.85em; color: #8899aa; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        margin-top: 4px;
        background: #101826;
        color: #cfd8e3;
        border: 1px solid #2a3545;
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.95em;
      }
      input:focus, select:focus { outline: none; border-color: #4a8af4; }
      .row { display: flex; gap: 12px; }
      .row > div { flex: 1; }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 10px;
        background: #4a8af4;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.95em;
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      button:hover:not(:disabled) { background: #5a96ff; }
      #result {
        margin-top: 16px;
        white-space: pre-wrap;
        background: #101826;
        padding: 16px;
        border-radius: 8px;
        min-height: 1.2em;
        font-size: 0.9em;
      }
      #status {
        margin-top: 12px;
        font-size: 0.85em;
        color: #8899aa;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.75em;
        margin-left: 6px;
      }
      .badge-ok { background: #1a3a2a; color: #4ade80; }
      .badge-ng { background: #3a1a1a; color: #f87171; }
      #checks {
        margin-top: 16px;
        background: #101826;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.85em;
        line-height: 2;
      }
      .section-label {
        font-size: 0.8em;
        color: #5a6a7a;
        margin-top: 16px;
        margin-bottom: 2px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <h1>PROJ sc-proj-data 検証</h1>
    <div class="subtitle">JGD2025 / JPGEO2024 対応確認</div>

    <nav style="margin-bottom:16px;font-size:0.85em">
      <a href="/tests/comparison.html" style="color:#4a8af4">Comparison Tests</a>
      &nbsp;|&nbsp;
      <a href="/examples/smoke.html" style="color:#4a8af4">Smoke Test</a>
    </nav>

    <div id="checks">Loading...</div>

    <div class="section-label">プリロード戦略</div>
    <div class="row" style="gap:8px;align-items:flex-end">
      <div style="flex:2">
        <label for="strategy">配信モード</label>
        <select id="strategy">
          <option value="ondemand" selected>On-demand: 変換時に必要grid のみ取得</option>
          <option value="all">All: 全 EPSG 用の grid を一括取得 (オフライン用途)</option>
        </select>
      </div>
      <div style="flex:1">
        <button id="preload-btn" type="button" style="margin-top:0">Run preload</button>
      </div>
    </div>
    <div id="preload-status" style="margin-top:8px;font-size:0.85em;color:#8899aa"></div>

    <div class="section-label">変換テスト</div>

    <label for="preset">プリセット</label>
    <select id="preset">
      <option value="">-- カスタム --</option>
      <option value="wgs84_to_jgd2011_9" selected>WGS84 → JGD2011 平面直角IX系 (東京)</option>
      <option value="jgd2000_to_jgd2011">JGD2000 → JGD2011 (グリッド変換)</option>
      <option value="jgd2011_to_wgs84">JGD2011 → WGS84</option>
      <option value="jgd2011_geoid">JGD2011楕円体高 → 標高 (ジオイド)</option>
      <option value="tokyo_to_jgd2011">旧日本測地系 → JGD2011</option>
    </select>

    <div class="row">
      <div>
        <label for="src">Source CRS</label>
        <input id="src" value="EPSG:4326" />
      </div>
      <div>
        <label for="dst">Destination CRS</label>
        <input id="dst" value="EPSG:6677" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="lon">経度 / X</label>
        <input id="lon" type="number" step="any" value="139.7671" />
      </div>
      <div>
        <label for="lat">緯度 / Y</label>
        <input id="lat" type="number" step="any" value="35.6812" />
      </div>
      <div>
        <label for="h">高さ / Z</label>
        <input id="h" type="number" step="any" value="0" />
      </div>
    </div>

    <button id="btn" disabled>Transform</button>
    <div id="status">Initializing PROJ runtime...</div>
    <pre id="result"></pre>

    <script type="module">
      import { createProj } from '/dist/lib/index.js';
      import { preloadGrids } from '/dist/lib/testing.js';

      const btn = document.getElementById('btn');
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const checksEl = document.getElementById('checks');
      const presetEl = document.getElementById('preset');
      const srcEl = document.getElementById('src');
      const dstEl = document.getElementById('dst');
      const lonEl = document.getElementById('lon');
      const latEl = document.getElementById('lat');
      const hEl = document.getElementById('h');
      const strategyEl = document.getElementById('strategy');
      const preloadBtn = document.getElementById('preload-btn');
      const preloadStatusEl = document.getElementById('preload-status');

      const PRESETS = {
        wgs84_to_jgd2011_9: {
          src: 'EPSG:4326', dst: 'EPSG:6677',
          lon: 139.7671, lat: 35.6812, h: 0,
          desc: 'WGS84 → JGD2011 平面直角IX系 (東京駅付近)',
        },
        jgd2000_to_jgd2011: {
          src: 'EPSG:4612', dst: 'EPSG:6668',
          lon: 139.7671, lat: 35.6812, h: 0,
          desc: 'JGD2000→JGD2011 (要グリッド: touhokutaiheiyouoki2011.gsb)',
        },
        jgd2011_to_wgs84: {
          src: 'EPSG:6668', dst: 'EPSG:4326',
          lon: 139.7671, lat: 35.6812, h: 0,
          desc: 'JGD2011 → WGS84',
        },
        jgd2011_geoid: {
          src: 'EPSG:6667', dst: 'EPSG:6697',
          lon: 139.7671, lat: 35.6812, h: 76.0,
          desc: 'JGD2011楕円体高 → JGD2011+標高 (要ジオイドグリッド)',
        },
        tokyo_to_jgd2011: {
          src: 'EPSG:4301', dst: 'EPSG:6668',
          lon: 139.7671, lat: 35.6812, h: 0,
          desc: '旧日本測地系(Tokyo) → JGD2011 (要グリッド)',
        },
      };

      let proj = null;

      async function refreshPreloadStatus(prefix) {
        let suffix = '';
        try {
          const est = await navigator.storage.estimate();
          const usedMB = (est.usage / 1024 / 1024).toFixed(1);
          const quotaMB = (est.quota / 1024 / 1024).toFixed(0);
          suffix = ` | OPFS ${usedMB} / ${quotaMB} MB`;
        } catch {}
        preloadStatusEl.textContent = (prefix || '') + suffix;
      }

      function describeFail(c) {
        if (c.reason === 'missing_grid' || c.reason === 'fetch_failed') {
          const names = (c.missing || []).map((m) => m.fullName || m.shortName).join(', ');
          return `missing grid: ${names || c.reason}`;
        }
        if (c.reason === 'ballpark_only') return 'no non-ballpark op';
        if (c.reason === 'hash_mismatch') return 'hash mismatch';
        return c.reason || 'failed';
      }

      presetEl.addEventListener('change', () => {
        const p = PRESETS[presetEl.value];
        if (!p) return;
        srcEl.value = p.src;
        dstEl.value = p.dst;
        lonEl.value = p.lon;
        latEl.value = p.lat;
        hEl.value = p.h;
        resultEl.textContent = '';
      });

      // Apply default preset on load
      presetEl.dispatchEvent(new Event('change'));

      createProj({
        dataBaseUrl: '/api/proj-data',
        dataDirName: 'proj-data',
        wasmUrl: '/dist/proj_wasm.wasm',
        onProgress: (p) => {
          if (p.stage === 'proj-db' && p.total) {
            const pct = ((p.bytes / p.total) * 100).toFixed(0);
            statusEl.textContent = `Downloading proj.db: ${pct}%`;
          }
        },
      }).then(async (api) => {
        proj = api;
        btn.disabled = false;
        preloadBtn.disabled = false;
        await refreshPreloadStatus(`data version ${api.dataVersion}`);
        statusEl.textContent = 'Ready';
        await runChecks();
      }).catch((err) => {
        statusEl.textContent = `Init failed: ${err.message || err}`;
        checksEl.innerHTML = `<span class="badge badge-ng">Init Error</span>`;
      });

      async function tryTransform(src, dst, x, y, z) {
        try {
          const r = await proj.transform(src, dst, x, y, z, { allowBallpark: true });
          if (isNaN(r.x) || r.x === Infinity) return { ok: false, reason: 'NaN' };
          return { ok: true, ...r };
        } catch (e) {
          if (e && e.name === 'MissingGridError') {
            return { ok: false, reason: e.reason, missing: e.missingGrids };
          }
          return { ok: false, reason: e && e.message || 'error' };
        }
      }

      async function runChecks() {
        checksEl.innerHTML = 'Checking...';
        const checks = [];

        // 1. JGD2011 basic projection (no datum grid needed)
        const c1 = await tryTransform('EPSG:4326', 'EPSG:6677', 139.7671, 35.6812, 0);
        checks.push({
          label: 'JGD2011 平面直角IX系',
          ok: c1.ok,
          detail: c1.ok ? `(${c1.x.toFixed(3)}, ${c1.y.toFixed(3)})` : describeFail(c1),
        });

        // 2. JGD2000 → JGD2011 (requires touhokutaiheiyouoki2011 — not in bundle)
        const c2 = await tryTransform('EPSG:4612', 'EPSG:6668', 139.7671, 35.6812, 0);
        const hasGrid = c2.ok &&
          Math.abs(c2.x - 139.7671) < 0.01 && Math.abs(c2.y - 35.6812) < 0.01;
        checks.push({
          label: 'JGD2000→JGD2011 グリッド変換',
          ok: hasGrid,
          detail: c2.ok ? `(${c2.x.toFixed(8)}, ${c2.y.toFixed(8)})` : describeFail(c2),
        });

        // 3. Geoid model (gsigeo2011) via CRS-to-CRS
        const c3 = await tryTransform('EPSG:6667', 'EPSG:6697', 139.7671, 35.6812, 76.0);
        const geoidOk = c3.ok && Math.abs(c3.z - 76.0) > 0.1;
        checks.push({
          label: 'ジオイドモデル (GSIGEO2011)',
          ok: geoidOk,
          detail: c3.ok ? `z=${c3.z.toFixed(3)}` : describeFail(c3),
        });

        // 4. Tokyo datum → JGD2011 (requires tky2jgd — not in bundle)
        const c4 = await tryTransform('EPSG:4301', 'EPSG:6668', 139.7671, 35.6812, 0);
        checks.push({
          label: '旧日本測地系→JGD2011',
          ok: c4.ok,
          detail: c4.ok ? `(${c4.x.toFixed(8)}, ${c4.y.toFixed(8)})` : describeFail(c4),
        });

        // 5. Belgium NTv2 grid (in bundle)
        const c5 = await tryTransform('EPSG:31370', 'EPSG:4326', 152000, 170000, 0);
        checks.push({
          label: 'Belgium NTv2 (BD72→WGS84)',
          ok: c5.ok && Math.abs(c5.x - 4.4) < 0.5 && Math.abs(c5.y - 50.85) < 0.5,
          detail: c5.ok ? `(${c5.x.toFixed(7)}, ${c5.y.toFixed(7)})` : describeFail(c5),
        });

        // Render
        checksEl.innerHTML = checks.map((c) => {
          const badge = c.ok
            ? `<span class="badge badge-ok">OK</span>`
            : `<span class="badge badge-ng">NG</span>`;
          const detail = c.detail ? ` <span style="color:#5a6a7a">${c.detail}</span>` : '';
          return `${c.label} ${badge}${detail}`;
        }).join('<br>');
      }

      preloadBtn.disabled = true;
      preloadBtn.addEventListener('click', async () => {
        if (!proj) return;
        const mode = strategyEl.value;
        preloadBtn.disabled = true;
        try {
          if (mode === 'all') {
            preloadStatusEl.textContent = 'Pre-fetching ALL grids... this may take a while.';
            const result = await preloadGrids(proj, 'all', {
              onProgress: ({ done, total }) => {
                preloadStatusEl.textContent = `Pre-fetching... ${done}/${total} grids`;
              },
            });
            await refreshPreloadStatus(`Pre-fetched ${result.fetched} grids. All persisted to OPFS.`);
          } else {
            // On-demand: pre-fetch only what the preset table needs.
            const pairs = Object.values(PRESETS).map((p) => ({
              src: p.src, dst: p.dst, x: p.lon, y: p.lat,
            }));
            preloadStatusEl.textContent = 'Computing required grids for preset CRS pairs...';
            const result = await preloadGrids(proj, pairs, {
              onProgress: ({ done, total }) => {
                preloadStatusEl.textContent = `Pre-fetching... ${done}/${total} grids`;
              },
            });
            await refreshPreloadStatus(`Pre-fetched ${result.fetched} grids for the preset CRS pairs.`);
          }
          await runChecks();
        } catch (e) {
          preloadStatusEl.textContent = `Preload failed: ${e.message || e}`;
        } finally {
          preloadBtn.disabled = false;
        }
      });

      btn.addEventListener('click', async () => {
        const src = srcEl.value.trim();
        const dst = dstEl.value.trim();
        const lon = parseFloat(lonEl.value);
        const lat = parseFloat(latEl.value);
        const h = parseFloat(hEl.value) || 0;

        if (!src || !dst || isNaN(lon) || isNaN(lat)) {
          resultEl.textContent = 'Invalid input';
          return;
        }

        btn.disabled = true;
        const preset = PRESETS[presetEl.value];
        const label = preset ? preset.desc : `${src} → ${dst}`;

        try {
          const r = await proj.transform(src, dst, lon, lat, h);
          resultEl.textContent =
            `${label}\n` +
            `─────────────────────────────\n` +
            `入力: (${lon}, ${lat}, ${h})\n` +
            `結果: x=${r.x}\n` +
            `      y=${r.y}\n` +
            `      z=${r.z}`;
        } catch (e) {
          if (e && e.name === 'MissingGridError') {
            const names = (e.missingGrids || []).map((m) => m.fullName || m.shortName).join('\n  ');
            resultEl.textContent = `MissingGridError (${e.reason})\n` +
              `Required grids not available:\n  ${names || '(unknown)'}\n\n` +
              `This is intentional: strict mode prevents silent fallback to a less-accurate ` +
              `Helmert/ballpark transformation. Add the grid file to proj-data and rebuild ` +
              `the manifest to fix.`;
          } else {
            resultEl.textContent = `Error: ${e.message || e}`;
          }
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
